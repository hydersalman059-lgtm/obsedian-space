<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Obsedian.Space Dashboard</title><link rel="stylesheet" href="/app.css"></head><body><header><a class="logo" href="/">OBSEDIAN<span>.SPACE</span></a><button id="logout">Logout</button></header><main><section id="login" class="card"><h1>Welcome back</h1><p>Email, phone OTP, Google or GitHub.</p><input id="email" placeholder="Email"><button id="emailBtn">Send email link</button><div class="split"><button id="google">Google</button><button id="github">GitHub</button></div><input id="phone" placeholder="+91XXXXXXXXXX"><button id="phoneBtn">Send phone OTP</button><p id="msg"></p></section><section id="dash" class="hidden"><div class="top"><div><small>WORKSPACE</small><h1 id="hello">Dashboard</h1></div><span id="badge"></span></div><div class="stats" id="stats"></div><div class="grid"><section class="card"><h2>Websites</h2><input id="url" placeholder="https://example.com"><input id="name" placeholder="Website name"><button id="add">Add website</button><div id="sites"></div></section><section class="card"><h2>AI Operations</h2><button id="audit">Run AI audit</button><button id="strategy">Generate SEO strategy</button><button id="report">Generate weekly report</button><pre id="out"></pre></section></div><section class="card"><h2>Approval Queue</h2><div id="approvals"></div></section><section class="card"><h2>Plan & Billing</h2><div id="billing"></div><button data-plan="growth">Growth</button><button data-plan="scale">Scale</button></section><section class="card"><h2>Support</h2><input id="subject" placeholder="Subject"><textarea id="support"></textarea><button id="ticket">Create support ticket</button></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app-config.js"></script><script src="/app.js"></script></body></html>
